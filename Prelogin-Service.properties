server.port=8085

# Database Configuration (Primary setup for local testing)
spring.datasource.url=jdbc:mysql://localhost:3306/prelogin_db
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client Configuration
# Allows the service to be discovered by the Service Registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Security Configuration
app.jwt.secret=755e4400ca9b850a43dd026081259da308374e93f7e85a5b3d205036c0d9fd4c
app.jwt.expiration=3600000

# Config Server (Set to optional to prevent startup failure)
spring.config.import=optional:configserver:http://localhost:8888
spring.cloud.config.fail-fast=false
